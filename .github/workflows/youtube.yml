name: Daily NotesBee Video Generator & YouTube Publisher

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: daily-notesbee-youtube-publisher
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read DAY number from youtube-day.json
        id: calc_day
        run: |
          if [ ! -f youtube-day.json ]; then
            echo '{"day": 1}' > youtube-day.json
          fi

          DAY=$(jq -r '.day // 1' youtube-day.json)

          echo "Current DAY: $DAY"
          echo "DAY=$DAY" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts mutagen requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate Voiceover
        run: |
          python scripts/generate_voiceover.py "$DAY"

      - name: Render video (video.mp4)
        run: |
          npx remotion render src/index.ts NotesBeeReel out/video.mp4 --props="{\"day\":$DAY}"

      - name: Publish Video to YouTube via Data API v3
        env:
          CURRENT_DAY: ${{ env.DAY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          SCOPES = ["https://www.googleapis.com/auth/youtube.upload"]

          def authenticate():
              token_str = os.environ.get("TOKEN_JSON", "").strip()
              if not token_str:
                  print("Error: TOKEN_JSON secret is empty or not set in GitHub Actions Secrets!")
                  sys.exit(1)

              try:
                  token_info = json.loads(token_str)
              except json.JSONDecodeError as e:
                  print(f"Error: TOKEN_JSON is not valid JSON. Details: {e}")
                  sys.exit(1)

              creds = Credentials.from_authorized_user_info(token_info, SCOPES)

              if not creds or not creds.valid:
                  if creds and creds.expired and creds.refresh_token:
                      print("Refreshing expired access token...")
                      creds.refresh(Request())
                  else:
                      print("Error: Valid refresh token missing in TOKEN_JSON.")
                      sys.exit(1)

              return build("youtube", "v3", credentials=creds)

          def main():
              current_day = os.environ.get("CURRENT_DAY", "1")
              video_file = "out/video.mp4"
              data_file = "youtube-data.json"

              if not os.path.exists(video_file):
                  print(f"Error: {video_file} not found!")
                  sys.exit(1)

              if not os.path.exists(data_file):
                  print(f"Error: {data_file} not found!")
                  sys.exit(1)

              # Load metadata from youtube-data.json
              with open(data_file, "r", encoding="utf-8") as f:
                  yt_data = json.load(f)

              # Replace $day placeholder dynamically
              raw_title = yt_data.get("title", "Day $day: Meet NotesBee 🐝")
              raw_description = yt_data.get("description", "")
              raw_tags = yt_data.get("tags", [])
              category_id = str(yt_data.get("categoryId", "28"))
              privacy_status = yt_data.get("privacyStatus", "public")

              title = raw_title.replace("$day", current_day)[:100]
              description = raw_description.replace("$day", current_day)
              tags = [tag.replace("$day", current_day) for tag in raw_tags]

              youtube = authenticate()

              body = {
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": tags,
                      "categoryId": category_id,
                  },
                  "status": {
                      "privacyStatus": privacy_status,
                      "selfDeclaredMadeForKids": False
                  }
              }

              print(f"Uploading video: {title}")
              media = MediaFileUpload(
                  video_file, 
                  mimetype="video/*", 
                  chunksize=4 * 1024 * 1024, 
                  resumable=True
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              try:
                  response = None
                  while response is None:
                      status, response = request.next_chunk()
                      if status:
                          print(f"Uploaded {int(status.progress() * 100)}%")

                  video_id = response.get("id")
                  print(f"\nSuccessfully published to YouTube! Video ID: {video_id}")
                  print(f"Watch live at: https://www.youtube.com/watch?v={video_id}")
              except HttpError as e:
                  print(f"\nYouTube API HTTP Error: {e.resp.status} - {e.content.decode('utf-8')}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

      - name: Increment and commit youtube-day.json
        if: success()
        run: |
          NEXT_DAY=$(( DAY + 1 ))
          jq --argjson next "$NEXT_DAY" '.day = $next' youtube-day.json > day.tmp.json && mv day.tmp.json youtube-day.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube-day.json
          git commit -m "chore: increment youtube day to $NEXT_DAY [skip ci]"
          for i in {1..5}; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            echo "Push rejected by remote, retrying in 3 seconds (attempt $i/5)..."
            sleep 3
          done
