name: Daily NotesBee Video Generator & Instagram Publisher

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: daily-notesbee-publisher
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read DAY number from day.json
        id: calc_day
        run: |
          if [ ! -f day.json ]; then
            echo '{"day": 1}' > day.json
          fi

          DAY=$(jq -r '.day // 1' day.json)

          echo "Current DAY: $DAY"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          # Unique tag prevents clashes on re-runs
          echo "TAG_NAME=temp-asset-d${DAY}-r${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts mutagen requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate voiceover
        run: |
          python scripts/generate_voiceover.py "$DAY"

      - name: Render video
        run: |
          npx remotion render src/index.ts NotesBeeReel out/video.mp4 --props="{\"day\":$DAY}"

      - name: Render thumbnail
        run: |
          npx remotion still src/index.ts NotesBeeThumbnail out/thumbnail.jpeg --image-format=jpeg --quality=95 --props="{\"day\":$DAY}"

      - name: Verify generated assets
        run: |
          ls -lh out/
          test -s out/video.mp4 || { echo "video.mp4 is empty or missing"; exit 1; }
          test -s out/thumbnail.jpeg || { echo "thumbnail.jpeg is empty or missing"; exit 1; }

      - name: Create Temporary Release for Asset Hosting
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Temporary Asset Hosting Day ${{ env.DAY }} [Run ${{ github.run_id }}]"
          draft: false
          prerelease: false
          files: |
            out/video.mp4
            out/thumbnail.jpeg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construct Download URLs
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ env.TAG_NAME }}"
          echo "VIDEO_URL=https://github.com/${REPO}/releases/download/${TAG}/video.mp4" >> "$GITHUB_ENV"
          echo "COVER_URL=https://github.com/${REPO}/releases/download/${TAG}/thumbnail.jpeg" >> "$GITHUB_ENV"

      - name: Publish Reel to Instagram via Graph API
        env:
          ACCESS_TOKEN: ${{ secrets.FACEBOOK_DEVELOPER_ACCESS_KEY }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_ID }}
          VIDEO_URL: ${{ env.VIDEO_URL }}
          COVER_URL: ${{ env.COVER_URL }}
          CURRENT_DAY: ${{ env.DAY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import requests

          access_token = os.environ.get("ACCESS_TOKEN")
          ig_user_id = os.environ.get("IG_USER_ID")
          video_url = os.environ.get("VIDEO_URL")
          cover_url = os.environ.get("COVER_URL")
          current_day = os.environ.get("DAY", "1")

          if not access_token or not ig_user_id:
              print("Missing secrets: FACEBOOK_DEVELOPER_ACCESS_KEY or INSTAGRAM_ID.")
              sys.exit(1)

          caption = ""
          if os.path.exists("caption.md"):
              with open("caption.md", "r", encoding="utf-8") as f:
                  caption = f.read().strip()
          
          # Replace $day with the actual day number
          caption = caption.replace("$day", current_day)

          api_version = "v19.0"
          base_url = f"https://graph.facebook.com/{api_version}"

          # Step 1: Create Container
          print(f"Creating container for user {ig_user_id}...")
          payload = {
              "media_type": "REELS",
              "video_url": video_url,
              "cover_url": cover_url,
              "caption": caption,
              "access_token": access_token
          }

          resp = requests.post(f"{base_url}/{ig_user_id}/media", data=payload)
          res_data = resp.json()

          if "id" not in res_data:
              print(f"Container Creation Failed: {res_data}")
              sys.exit(1)

          container_id = res_data["id"]
          print(f"Container created: {container_id}")

          # Step 2: Poll container status
          max_retries = 40
          delay = 10
          finished = False

          for attempt in range(max_retries):
              time.sleep(delay)
              status_res = requests.get(
                  f"{base_url}/{container_id}",
                  params={"fields": "status_code", "access_token": access_token}
              ).json()

              status_code = status_res.get("status_code")
              print(f"Status check ({attempt + 1}/{max_retries}): {status_code}")

              if status_code == "FINISHED":
                  finished = True
                  break
              elif status_code == "ERROR":
                  print(f"Processing error: {status_res}")
                  sys.exit(1)

          if not finished:
              print("Video transcoding timed out on Instagram servers.")
              sys.exit(1)

          # Step 3: Publish container
          print("Publishing container...")
          pub_res = requests.post(
              f"{base_url}/{ig_user_id}/media_publish",
              data={"creation_id": container_id, "access_token": access_token}
          ).json()

          if "id" in pub_res:
              print(f"Published successfully! Reel ID: {pub_res['id']}")
          else:
              print(f"Publish failed: {pub_res}")
              sys.exit(1)
          EOF

      - name: Increment and commit day.json
        if: success()
        run: |
          NEXT_DAY=$(( DAY + 1 ))
          jq --argjson next "$NEXT_DAY" '.day = $next' day.json > day.tmp.json && mv day.tmp.json day.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add day.json
          git commit -m "chore: increment day to $NEXT_DAY [skip ci]"
          git push

      - name: Clean up Release & Tag
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.TAG_NAME }}" --yes --cleanup-tag || true
