name: Build NotesBee Reel - Test Day 1

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies (Edge-TTS & Mutagen)
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts mutagen

      - name: Generate Voiceover & SFX for Day 1
        run: python scripts/generate_voiceover.py 1

      - name: Render Remotion Video Reel (MP4)
        run: |
          npx remotion render src/index.ts NotesBeeReel out/NotesBee_Day_1.mp4

      - name: Render Remotion Cover Thumbnail (JPEG)
        run: |
          npx remotion still src/index.ts NotesBeeThumbnail out/NotesBee_Day_1.jpeg --image-format=jpeg --quality=95 --props='{"day":1}'

      - name: Upload Video & Thumbnail Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotesBee-Day-1-Output
          path: |
            out/NotesBee_Day_1.mp4
            out/NotesBee_Day_1.jpeg
          retention-days: 7
