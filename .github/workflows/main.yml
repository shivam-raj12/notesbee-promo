name: Test NotesBee Video Generator

on:
  workflow_dispatch:

env:
  DAY: "100"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate video
        run: |
          python daily.py --day "$DAY"

      - name: Generate thumbnail
        run: |
          python3 scripts/thumbnail.py --day "$DAY"

      - name: Verify generated assets
        run: |
          ls -lh output/
          test -f output/video.mp4
          test -f output/thumbnail.jpg

      - name: Upload generated video and thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: NotesBee-Assets
          path: |
            output/video.mp4
            output/thumbnail.jpg
          retention-days: 1
