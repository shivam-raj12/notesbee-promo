name: Build NotesBee Reel - Day 10

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies (Edge-TTS & Mutagen)
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts mutagen

      - name: Generate Voiceover for Day 10
        run: python scripts/generate_voiceover.py 10

      - name: Render Remotion Video Reel (video.mp4)
        run: |
          npx remotion render src/index.ts NotesBeeReel out/video.mp4 --props='{"day":10}'

      - name: Render Remotion Cover Thumbnail (thumbnail.jpeg)
        run: |
          npx remotion still src/index.ts NotesBeeThumbnail out/thumbnail.jpeg --image-format=jpeg --quality=95 --props='{"day":10}'

      - name: Upload Video & Thumbnail Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotesBee-Day-10-Output
          path: |
            out/video.mp4
            out/thumbnail.jpeg
          retention-days: 7