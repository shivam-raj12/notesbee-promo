name: Test NotesBee Video Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Day 1 video
        run: |
          python daily.py --day 1

      - name: Generate Day 1 thumbnail
        run: |
          python3 scripts/thumbnail.py --day 1

      - name: Verify generated assets
        run: |
          ls -lh output/
          test -f output/NotesBee-Day-01.mp4

      - name: Upload generated video and thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: NotesBee-Day-01-Assets
          path: |
            output/NotesBee-Day-01.mp4
            output/*thumb*
            output/*Day-01*
          retention-days: 1
