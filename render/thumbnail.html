<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotesBee Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #E9F1FE;
            --bg-mid: #F6F8FE;
            --bg-bottom: #FFF5EE;
            --navy: #0E172E;
            --amber: #D97706;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        html, body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
        }

        /* Ambient background glow */
        .ambient-blur {
            position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; opacity: 0.6;
        }
        .blur-1 { width: 750px; height: 750px; left: -150px; top: 200px; background: #DBEAFE; }
        .blur-2 { width: 700px; height: 700px; right: -120px; bottom: 300px; background: #FED7AA; opacity: 0.45; }

        /* Profile Safe-Area Container: Strictly centered in the 1080x1080 middle square (y: 420 to 1500) */
        #safe-container {
            position: absolute;
            left: 0;
            top: 450px;
            width: 1080px;
            height: 1020px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justifyContent: center;
            z-index: 10;
        }

        /* DAY Count Header */
        .day-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            position: relative;
        }
        .day-glow {
            position: absolute;
            right: -20px;
            top: -20px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 126, 34, 0.25) 0%, rgba(230, 126, 34, 0) 70%);
            pointer-events: none;
        }
        .day-text {
            font-size: 110px;
            font-weight: 900;
            color: #0B0F19;
            line-height: 1;
            letter-spacing: -3px;
        }
        .day-num {
            font-size: 110px;
            font-weight: 900;
            color: var(--amber);
            line-height: 1;
            letter-spacing: -3px;
            z-index: 1;
        }

        /* App Icon */
        .icon-wrap {
            width: 230px;
            height: 230px;
            border-radius: 52px;
            background: #FFFFFF;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .icon-wrap img {
            width: 190px;
            height: 190px;
            border-radius: 42px;
        }

        /* Title */
        .app-title {
            font-size: 64px;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -1.5px;
            margin-bottom: 26px;
        }

        /* Google Play Badge */
        .play-badge {
            width: 520px;
            filter: drop-shadow(0 15px 35px rgba(15, 23, 42, 0.15));
            margin-bottom: 40px;
        }

        /* Link In Bio Button */
        .link-btn {
            width: 440px;
            padding: 18px 0;
            border-radius: 999px;
            background: #0E172E;
            color: #FFFFFF;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 4px;
            box-shadow: 0 15px 35px rgba(14, 23, 46, 0.22);
            text-align: center;
        }
    </style>
</head>
<body>
<div class="ambient-blur blur-1"></div>
<div class="ambient-blur blur-2"></div>

<div id="safe-container">
    <!-- Day Hook -->
    <div class="day-row">
        <div class="day-glow"></div>
        <span class="day-text">DAY</span>
        <span id="day-number" class="day-num">01</span>
    </div>

    <!-- App Icon -->
    <div class="icon-wrap">
        <img src="/assets/notesbee-icon.png" alt="NotesBee">
    </div>

    <!-- App Name -->
    <div class="app-title">NotesBee</div>

    <!-- Google Play -->
    <img class="play-badge" src="/assets/play-badge.png" alt="Google Play">

    <!-- CTA -->
    <div class="link-btn">LINK IN BIO</div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const day = parseInt(params.get("day") || "1", 10);
    document.getElementById("day-number").textContent = String(day).padStart(2, "0");
    window.__ready = document.fonts.ready;
</script>
</body>
</html>
