<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotesBee Promo Renderer</title>
    <!-- Modern Typography for sleek Android / iOS app look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060813;
            --panel: rgba(18, 24, 46, 0.75);
            --amber: #FFB72B;
            --honey: #FF8F3D;
            --mint: #00F5A0;
            --violet: #8F72FF;
            --electric: #00D2FF;
            --ink: #FFFFFF;
            --dim: #94A3B8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body {
            width: 1080px; height: 1920px;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--ink);
        }
        #stage {
            position: fixed; left: 0; top: 0; width: 1080px; height: 1920px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 18%, #161D3B 0%, #070914 55%, #030408 100%);
        }
        /* Ambient colored background lights for depth */
        .glow-orb {
            position: absolute; border-radius: 50%; filter: blur(140px); pointer-events: none; opacity: 0.35;
        }
        .orb-1 { width: 700px; height: 700px; left: -100px; top: 200px; background: #6366F1; }
        .orb-2 { width: 650px; height: 650px; right: -150px; top: 800px; background: #FF9E3D; opacity: 0.22; }

        #world {
            position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
            transform-origin: 540px 960px; will-change: transform;
        }
        .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
        #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 400; }

        /* Modern Cinematic Vignette */
        #vignette {
            position: absolute; inset: 0; z-index: 500; pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(2, 3, 8, 0.75) 100%);
        }
        #grain {
            position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
            z-index: 501; pointer-events: none; opacity: 0.035; mix-blend-mode: overlay;
        }

        /* Subtitles with modern kinetic styling & pill glass */
        #subtitles {
            position: absolute; left: 60px; right: 60px; top: 1440px;
            z-index: 600; text-align: center; pointer-events: none;
        }
        .subpill {
            display: inline-block;
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 20px 42px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2);
            max-width: 960px;
        }
        .subw {
            display: inline-block; font-size: 46px; font-weight: 700; line-height: 1.3;
            color: rgba(255, 255, 255, 0.6); margin: 0 8px;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .subw.past { color: #FFFFFF; }
        .subw.key {
            color: var(--amber); font-weight: 800;
            text-shadow: 0 0 25px rgba(255, 183, 43, 0.6);
            transform: scale(1.08);
        }
        .subw.key2 {
            color: var(--mint); font-weight: 800;
            text-shadow: 0 0 25px rgba(0, 245, 160, 0.6);
            transform: scale(1.08);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .black { font-weight: 800; } .bold { font-weight: 700; } .med { font-weight: 500; }
    </style>
</head>
<body>
<div id="stage">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div id="world"></div>
    <canvas id="fx" width="1080" height="1920"></canvas>
    <div id="vignette"></div>
    <canvas id="grain" width="270" height="480"></canvas>
    <div id="subtitles"></div>
</div>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/scenes.js"></script>
<script src="js/scenes2.js"></script>
<script src="js/scenes3.js"></script>
<script src="js/main.js"></script>
</body>
</html>
