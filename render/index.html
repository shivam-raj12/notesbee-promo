<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NotesBee Clean Promo</title>
    <!-- Google Display Fonts matching your Play Store typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #E9F1FE;
            --bg-mid: #F6F8FE;
            --bg-bottom: #FFF5EE;
            --navy: #0E172E;
            --navy-dim: #475569;
            --amber: #F59E0B;
            --amber-dark: #D97706;
            --blue: #3B82F6;
            --mint: #10B981;
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(219, 234, 254, 0.7);
            --shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12), 0 8px 16px -6px rgba(15, 23, 42, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body {
            width: 1080px; height: 1920px;
            overflow: hidden;
            background: var(--bg-mid);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--navy);
        }
        #stage {
            position: fixed; left: 0; top: 0; width: 1080px; height: 1920px;
            overflow: hidden;
            background: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
        }

        /* Soft ambient background blooms matching the listing style */
        .ambient-blur {
            position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; opacity: 0.65;
        }
        .blur-1 { width: 750px; height: 750px; left: -150px; top: -100px; background: #DBEAFE; }
        .blur-2 { width: 700px; height: 700px; right: -120px; bottom: 100px; background: #FED7AA; opacity: 0.45; }

        #world {
            position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
            transform-origin: 540px 960px; will-change: transform;
        }
        .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
        #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 400; }

        /* Kinetic Captions Container — Centered, strictly inside the vertical safe area */
        /* Refined, Minimalist Mobile Captions */
        #subtitles {
            position: absolute;
            bottom: 275px;
            left: 540px;
            transform: translateX(-50%);
            width: 880px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 500;
        }
        .subpill {
            padding: 10px 24px;
            border-radius: 999px;
            background: rgba(14, 23, 46, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 10px;
            max-width: 820px;
        }
        .sub-word {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.3px;
            color: rgba(255, 255, 255, 0.45);
            display: inline-block;
            transform-origin: center bottom;
            transition: color 0.12s ease-out, transform 0.12s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .sub-word.active {
            color: #FBBF24;
            font-weight: 800;
            transform: scale(1.08);
            text-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
        }
        .sub-word.spoken {
            color: #FFFFFF;
            font-weight: 700;
            transform: scale(1);
        }
    </style>
</head>
<body>
<div id="stage">
    <div class="ambient-blur blur-1"></div>
    <div class="ambient-blur blur-2"></div>
    <div id="world"></div>
    <div id="subtitles"></div>
    <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/scenes.js"></script>
<script src="js/scenes2.js"></script>
<script src="js/scenes3.js"></script>
<script src="js/main.js"></script>
</body>
</html>
